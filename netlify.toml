# NESA-Africa — Netlify build & SPA routing config
# The `public/_redirects` file is the source of truth for redirects;
# this block is a safety net so SPA routing still works if that file
# is ever missing from the publish directory.

[build]
  publish = "dist"
  command = "npm run build"

# SPA fallback for client-side routing (React Router).
# Any unmatched URL is served index.html with a 200 so the app can
# render the correct route (including the custom 404 page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never let a browser or CDN edge keep an old app shell: index.html must be
# revalidated on every load, otherwise it can reference JS chunk hashes that
# no longer exist after a deploy ("failed to fetch dynamically imported module").
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
