name: E2E Visual Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bun playwright install chromium

      - name: Build & run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright artifacts (screenshots + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: tests/e2e/**/*.spec.ts-snapshots/
          retention-days: 7

      # Dedicated bundle for the navbar visual regression spec. Playwright
      # writes -actual.png / -expected.png / -diff.png into
      # test-results/<test-id>/ on failure; we also re-run a capture-only
      # spec so reviewers get a fresh header screenshot at EVERY tracked
      # viewport width (not only the failing ones).
      - name: Capture navbar at every width (failure only)
        if: failure()
        env:
          PLAYWRIGHT_CAPTURE_NAVBAR: "1"
          # Reuse the already-built preview if still running; otherwise the
          # config's webServer will rebuild.
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: |
          # Start preview in background if the previous server isn't up.
          (curl -sf http://localhost:4173 > /dev/null) || (bun run preview -- --port 4173 --strictPort &)
          for i in $(seq 1 60); do curl -sf http://localhost:4173 > /dev/null && break || sleep 2; done
          bun playwright test navbar-visual-capture --reporter=list || true

      - name: Collect navbar-visual diff bundle
        if: failure()
        run: |
          set -e
          mkdir -p navbar-visual-artifacts/diffs navbar-visual-artifacts/baselines navbar-visual-artifacts/captures
          # Failure outputs (actual + expected + diff PNGs) — only present
          # for the widths that actually failed.
          if compgen -G "test-results/*navbar-visual*" > /dev/null; then
            cp -r test-results/*navbar-visual* navbar-visual-artifacts/diffs/ || true
          fi
          # Committed baselines for side-by-side comparison.
          if [ -d tests/e2e/navbar-visual.spec.ts-snapshots ]; then
            cp -r tests/e2e/navbar-visual.spec.ts-snapshots/. navbar-visual-artifacts/baselines/ || true
          fi
          # Fresh per-width captures from the capture-only spec.
          if [ -d test-results/navbar-captures ]; then
            cp -r test-results/navbar-captures/. navbar-visual-artifacts/captures/ || true
          fi
          ls -R navbar-visual-artifacts || true

      - name: Upload navbar-visual diff bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-visual-diffs
          path: navbar-visual-artifacts/
          retention-days: 14
          if-no-files-found: ignore
