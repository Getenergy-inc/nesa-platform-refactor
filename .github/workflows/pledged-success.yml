name: Pledged Success Gate

# Hard CI gate for the Rebuild My School Africa pledged-success flow.
#
# Fails the build if ANY of these regress:
#   - Pledge success banner stops rendering after return
#   - #donate scroll behavior breaks
#   - ?pledged=success is not stripped (or is stripped more than once)
#   - Unrelated query params (utm_source / utm_campaign / ref / return_to) get dropped
#   - return_to round-trip from /donate back to the hub breaks
#
# Runs on every push and every pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit — pledged-success URL handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run pledged-success unit tests
        run: bunx vitest run src/pages/eduaid/__tests__/RebuildHubPage.pledged.test.tsx

  e2e:
    name: E2E — pledged-success round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Install Playwright (chromium only)
        run: bun playwright install --with-deps chromium
      - name: Run pledged-success E2E
        run: bunx playwright test tests/e2e/pledged-success.spec.ts --project=chromium-desktop
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pledged-success-playwright
          path: test-results/
          retention-days: 7
